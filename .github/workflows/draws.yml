name: draws

# 토요일 밤 추첨 뒤 당첨번호를 받아 draws.json 에 커밋한다. GitHub Pages가 이 파일을 그대로 공개한다.
on:
  schedule:
    - cron: "7 13,15 * * 6"   # 토 22:07, 24:07 (한국 시간)
    - cron: "7 1 * * 0,1"     # 일·월 10:07 (놓쳤을 때 한 번 더)
  workflow_dispatch:

permissions:
  contents: write
  pages: write

jobs:
  draws:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/lotto_draws.py draws.json
      - name: Commit
        run: |
          if [ -z "$(git status --porcelain draws.json)" ]; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add draws.json
          git commit -m "당첨번호 갱신"
          git push
          # 봇(GITHUB_TOKEN)이 올린 커밋은 Pages 를 다시 만들지 않을 수 있어 직접 요청한다
          gh api -X POST "repos/${{ github.repository }}/pages/builds" || true
        env:
          GH_TOKEN: ${{ github.token }}
