name: screens

# 손으로 돌리는 화면 캡처. 에뮬레이터에서 앱을 켜고 탭별로 찍어 screens 브랜치에 올린다.
on: workflow_dispatch

permissions:
  contents: write

jobs:
  shots:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build
        run: cd android && ./gradlew --no-daemon :app:assembleRelease
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: bash tools/screens.sh
      - name: Push screenshots
        run: |
          mkdir -p /tmp/out && cp shots/*.png /tmp/out/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan screens
          git rm -rf -q --cached .
          rm -rf ./*
          cp /tmp/out/*.png .
          git add *.png
          git commit -q -m "화면 캡처 ${{ github.sha }}"
          git push -f origin screens
